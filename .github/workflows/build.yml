name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        id: build
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --no-configuration-cache 2>&1 | tee build.log

      - name: Collect APK
        if: success()
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/orbis.apk
          ls -la out

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: orbis-apk
          path: out/orbis.apk

      # Only builds of `main` become a public release with a fixed download link.
      - name: Publish release
        if: success() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Orbis 1.0.${{ github.run_number }}
          make_latest: true
          files: out/orbis.apk
          body: |
            Auf dem Handy öffnen, **orbis.apk** antippen und installieren.
            Dauerhafter Link zur neuesten Version:
            https://github.com/${{ github.repository }}/releases/latest/download/orbis.apk

      - name: Show compiler errors
        if: failure()
        run: grep -nE "^e: |error:|What went wrong|Could not|Unresolved" build.log | head -200 || true
