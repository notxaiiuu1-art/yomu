# Pinned to the same set Mihon v0.21.0 builds with (Oct 2026), so every artifact resolves
# together and the runtime libraries extensions call into (OkHttp, kotlinx.serialization,
# Jsoup, Injekt, RxJava, QuickJS) are the versions the extensions were built against.
[versions]
agp = "9.4.1"
kotlin = "2.4.21"
compose-bom = "2026.10.00"
material-icons = "1.7.8"
activity-compose = "1.13.0"
androidx-core = "1.19.1"
splashscreen = "1.2.0"
lifecycle = "2.11.0"
work = "2.12.0"
preference = "1.2.1"
appcompat = "1.8.0"
webkit = "1.17.1"
coil = "3.6.3"
okhttp = "5.5.0"
okio = "3.18.2"
serialization = "1.11.0"
coroutines = "1.11.0"
jsoup = "1.23.2"
injekt = "1.16.1"
rxjava = "1.3.8"
quickjs = "547f5b1597"
desugar = "2.1.5"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom-beta", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-animation = { module = "androidx.compose.animation:animation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "material-icons" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-core = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-work = { module = "androidx.work:work-runtime", version.ref = "work" }
androidx-preference = { module = "androidx.preference:preference-ktx", version.ref = "preference" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }

coil-core = { module = "io.coil-kt.coil3:coil", version.ref = "coil" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-gif = { module = "io.coil-kt.coil3:coil-gif", version.ref = "coil" }

okhttp-core = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-brotli = { module = "com.squareup.okhttp3:okhttp-brotli", version.ref = "okhttp" }
okhttp-zstd = { module = "com.squareup.okhttp3:okhttp-zstd", version.ref = "okhttp" }
okhttp-doh = { module = "com.squareup.okhttp3:okhttp-dnsoverhttps", version.ref = "okhttp" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }

serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
serialization-json-okio = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json-okio", version.ref = "serialization" }
serialization-protobuf = { module = "org.jetbrains.kotlinx:kotlinx-serialization-protobuf", version.ref = "serialization" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
injekt = { module = "uy.kohesive.injekt:injekt-core", version.ref = "injekt" }
rxjava = { module = "io.reactivex:rxjava", version.ref = "rxjava" }
quickjs = { module = "com.github.zhanghai.quickjs-java:quickjs-android", version.ref = "quickjs" }
desugar = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
